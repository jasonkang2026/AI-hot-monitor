<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Hot Monitor</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <i class="bi bi-fire text-warning fs-4"></i>
      <span class="fw-bold fs-5">AI Hot Monitor</span>
    </a>
    <span id="updated-at" class="text-secondary small"></span>
  </nav>

  <div class="container-fluid py-4 px-4">
    <!-- Source filter tabs -->
    <ul class="nav nav-pills mb-4" id="sourceTabs">
      <li class="nav-item">
        <button class="nav-link active" data-source="all">
          <i class="bi bi-grid-3x3-gap me-1"></i>All Sources
        </button>
      </li>
    </ul>

    <!-- Loading indicator -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-warning" role="status"></div>
      <p class="mt-3 text-muted">Fetching trending AI topics…</p>
    </div>

    <!-- Error state -->
    <div id="error-state" class="d-none text-center py-5">
      <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
      <p class="mt-3 text-muted">Failed to load topics. Please try again.</p>
      <button class="btn btn-outline-warning mt-2" onclick="loadTopics()">
        <i class="bi bi-arrow-clockwise me-1"></i>Retry
      </button>
    </div>

    <!-- Topics grid -->
    <div id="topics-grid" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span id="result-count" class="text-muted small"></span>
        <button class="btn btn-sm btn-outline-warning" onclick="loadTopics()">
          <i class="bi bi-arrow-clockwise me-1"></i>Refresh
        </button>
      </div>
      <div id="cards-container" class="row g-3"></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
